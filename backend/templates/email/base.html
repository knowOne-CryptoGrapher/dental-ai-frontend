<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Front Desk Dental AI</title>
  <style>
    body  { margin: 0; padding: 0; background-color: #f4f4f7; font-family: Arial, Helvetica, sans-serif; }
    table { border-spacing: 0; }
    td    { padding: 0; }
    img   { border: 0; }
    a     { color: #1a1a2e; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;">
  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:32px 16px;">
    <tr>
      <td align="center">

        <!-- Email card — max 600px -->
        <table width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background-color:#ffffff;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color:#1a1a2e;padding:24px 32px;">
              <span style="color:#ffffff;font-size:20px;font-weight:bold;font-family:Arial,Helvetica,sans-serif;letter-spacing:0.5px;">
                Front Desk Dental AI
              </span>
            </td>
          </tr>

          <!-- Body content -->
          <tr>
            <td style="padding:36px 32px 28px 32px;color:#333333;font-size:15px;line-height:1.7;font-family:Arial,Helvetica,sans-serif;">
              $body_content
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f4f4f7;border-top:1px solid #e5e5e5;padding:20px 32px;">
              <p style="margin:0 0 6px 0;font-size:12px;color:#888888;font-family:Arial,Helvetica,sans-serif;line-height:1.5;">
                This email was sent by Front Desk Dental AI on behalf of $practice_name.
              </p>
              <p style="margin:0 0 6px 0;font-size:12px;color:#888888;font-family:Arial,Helvetica,sans-serif;line-height:1.5;">
                $footer_text
              </p>
              <p style="margin:0;font-size:11px;color:#aaaaaa;font-family:Arial,Helvetica,sans-serif;">
                &copy; $year Front Desk Dental AI. All rights reserved.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Email card -->

      </td>
    </tr>
  </table>
  <!-- /Outer wrapper -->
</body>
</html>
