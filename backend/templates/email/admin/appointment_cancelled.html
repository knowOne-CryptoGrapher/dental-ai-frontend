<h2 style="color:#1a1a2e;font-size:20px;margin:0 0 16px;">Appointment Cancelled — $practice_name</h2>
<p style="color:#374151;font-size:15px;line-height:1.6;margin:0 0 20px;">
  A patient has cancelled their appointment. You may want to follow up or offer an alternate time.
</p>
<table width="100%" cellpadding="0" cellspacing="0"
  style="border:1px solid #e5e7eb;border-radius:6px;margin:0 0 24px;">
  <tr><td style="padding:16px 20px;">
    <table width="100%" cellpadding="5" cellspacing="0">
      <tr>
        <td style="color:#6b7280;font-size:13px;width:150px;">Patient Name</td>
        <td style="color:#111827;font-size:13px;font-weight:600;">$patient_name</td>
      </tr>
      <tr>
        <td style="color:#6b7280;font-size:13px;">Original Date</td>
        <td style="color:#111827;font-size:13px;font-weight:600;">$appointment_date</td>
      </tr>
      <tr>
        <td style="color:#6b7280;font-size:13px;">Original Time</td>
        <td style="color:#111827;font-size:13px;">$appointment_time</td>
      </tr>
      <tr>
        <td style="color:#6b7280;font-size:13px;">Provider</td>
        <td style="color:#111827;font-size:13px;">$provider_name</td>
      </tr>
    </table>
  </td></tr>
</table>
<table cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:4px;background-color:#1a1a2e;">
      <a href="$dashboard_url"
        style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;
        font-weight:600;text-decoration:none;font-family:sans-serif;">
        View Appointments
      </a>
    </td>
  </tr>
</table>
