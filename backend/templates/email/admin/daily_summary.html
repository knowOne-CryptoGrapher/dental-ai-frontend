<h2 style="color:#1a1a2e;font-size:20px;margin:0 0 4px;">Daily Summary — $practice_name</h2>
<p style="color:#6b7280;font-size:13px;margin:0 0 20px;">$summary_date</p>
<table width="100%" cellpadding="0" cellspacing="0"
  style="border:1px solid #e5e7eb;border-radius:6px;margin:0 0 24px;">
  <tr><td style="padding:16px 20px;">
    <table width="100%" cellpadding="8" cellspacing="0">
      <tr style="border-bottom:1px solid #f3f4f6;">
        <td style="color:#6b7280;font-size:13px;">Total Calls</td>
        <td style="color:#111827;font-size:20px;font-weight:700;text-align:right;">$total_calls</td>
      </tr>
      <tr style="border-bottom:1px solid #f3f4f6;">
        <td style="color:#6b7280;font-size:13px;">Appointments Booked</td>
        <td style="color:#0d9488;font-size:20px;font-weight:700;text-align:right;">$appointments_booked</td>
      </tr>
      <tr style="border-bottom:1px solid #f3f4f6;">
        <td style="color:#6b7280;font-size:13px;">New Patients</td>
        <td style="color:#111827;font-size:20px;font-weight:700;text-align:right;">$new_patients</td>
      </tr>
      <tr>
        <td style="color:#6b7280;font-size:13px;">Follow-Ups Flagged</td>
        <td style="color:#f59e0b;font-size:20px;font-weight:700;text-align:right;">$emergencies</td>
      </tr>
    </table>
  </td></tr>
</table>
<table cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:4px;background-color:#1a1a2e;">
      <a href="$dashboard_url"
        style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;
        font-weight:600;text-decoration:none;font-family:sans-serif;">
        View Full Report
      </a>
    </td>
  </tr>
</table>
