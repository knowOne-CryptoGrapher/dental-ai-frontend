<h2 style="color:#1a1a2e;font-size:20px;margin:0 0 16px;">Follow-Up Required — $practice_name</h2>
<p style="color:#374151;font-size:15px;line-height:1.6;margin:0 0 20px;">
  An incoming call has been flagged for follow-up by your AI receptionist. Please review the details below.
</p>
<table width="100%" cellpadding="0" cellspacing="0"
  style="border:1px solid #e5e7eb;border-radius:6px;margin:0 0 20px;">
  <tr><td style="padding:16px 20px;">
    <table width="100%" cellpadding="5" cellspacing="0">
      <tr>
        <td style="color:#6b7280;font-size:13px;width:150px;vertical-align:top;">Caller Phone</td>
        <td style="color:#111827;font-size:13px;font-weight:600;">$caller_phone</td>
      </tr>
      <tr>
        <td style="color:#6b7280;font-size:13px;vertical-align:top;">Reason / Type</td>
        <td style="color:#111827;font-size:13px;font-weight:600;">$emergency_type</td>
      </tr>
      <tr>
        <td style="color:#6b7280;font-size:13px;vertical-align:top;">Call Time</td>
        <td style="color:#111827;font-size:13px;">$call_time</td>
      </tr>
    </table>
  </td></tr>
</table>
<p style="color:#6b7280;font-size:13px;margin:0 0 8px;">Transcript excerpt:</p>
<p style="color:#374151;font-size:13px;font-style:italic;background:#fef3c7;
  padding:12px 16px;border-left:3px solid #f59e0b;border-radius:0 4px 4px 0;margin:0 0 24px;
  line-height:1.6;">"$transcript_excerpt"</p>
<table cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:4px;background-color:#1a1a2e;">
      <a href="$dashboard_url"
        style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;
        font-weight:600;text-decoration:none;font-family:sans-serif;">
        View Call Log
      </a>
    </td>
  </tr>
</table>
